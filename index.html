<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BitCrafter - Portfolio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">

<script>
const ME = {

  // GitHub username
  github: "Film-ware",

  // นามแฝง (ไม่ใช้ชื่อจริง)
  name: "BitCrafter",

  // ข้อความสีแดงด้านบนเหมือนในรูป (ระบุมหาวิทยาลัย แต่ปิดชื่อจริง)
  role: "A FIRST-YEAR COMPUTER ENGINEERING STUDENT AT RAJAMANGALA UNIVERSITY OF TECHNOLOGY ISAN. MY ALIAS IS BITCRAFTER.",

  // Tagline (ตัวอักษรสีขาวใต้ชื่อ)
  tagline: "Transforming logic and coffee into code and circuits.",

  // ข้อความแนะนำตัวเหมือนในรูปเป๊ะๆ (ภาษาอังกฤษ)
  about: "Hi!, my alias is BitCrafter. I am studying Computer Engineering at RMUTI Khon Kaen, and I would like to work as a developer. I also want to keep improving my skills in this field, bridging software and hardware, and continue developing myself.",

  // สิ่งที่กำลังเรียนรู้
  learning: [
    "HTML, CSS, JAVASCRIPT",
    "Programming Languages: C, Python, and Java",
    "Microcontrollers & IoT: Embedded systems and sensor integration"
  ],

  // ผลงาน 3 อย่าง
  works: [
    {
      title: "Classroom Booking System",
      desc: "Final Project: A comprehensive web-based platform designed for reserving and efficiently managing classroom schedules.",
    },
    {
      title: "Line-Following & RC Robot",
      desc: "An autonomous line-following robot powered by Arduino, featuring manual movement control via a mobile smartphone app.",
    },
    {
      title: "Smart Trash Can",
      desc: "An automated, hands-free desktop trash can built with an ultrasonic sensor and a servo motor.",
    }
  ],

  // ปุ่ม GitHub เหมือนในรูป
  links: [
    { label: "GitHub", url: "https://github.com/Film-ware" }
  ],

  // ธีมสีแดง-ดำ เหมือนในรูป
  theme: "crimson",

};
</script>

<style>
/* ---------- สีพื้นฐาน ---------- */
:root {
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

/* ---------- ธีมสีแดง (Crimson) ตามรูปภาพ ---------- */
[data-theme="crimson"] {
  --accent: #ff3333;       /* สีแดงสดสำหรับข้อความ Role และขอบต่างๆ */
  --accent-soft: #cc0000;  /* สีแดงเข้มเวลา Hover */
  --glow1: #3a0000;        /* แสงพื้นหลังสีแดงเข้มซ้ายบน */
  --glow2: #200000;        /* แสงพื้นหลังขวาล่าง */
  --bg: #050505;           /* พื้นหลังสีดำสนิท */
  --line: #330000;         /* เส้นคั่นสีแดงมืดๆ */
  --text: #ffffff;         /* ตัวอักษรสีขาว */
  --muted: #dddddd;        /* ตัวอักษรสีเทาสว่างสำหรับ About */
  --surface: rgba(255, 0, 0, 0.05); /* พื้นหลังการ์ดใสๆ อมแดง */
}

*{ box-sizing:border-box }

body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;
  line-height:1.75;
  background:
    radial-gradient(1000px 460px at 12% -10%, var(--glow1) 0, transparent 60%),
    radial-gradient(820px 400px at 92% 0,   var(--glow2) 0, transparent 55%),
    var(--bg);
}

.wrap{ max-width:760px; margin:0 auto; padding:0 22px 80px }

.hero{ display:flex; gap:22px; align-items:center; padding:64px 0 8px; flex-wrap:wrap }
.avatar{
  width:96px; height:96px; border-radius:50%;
  border:2px solid var(--accent); object-fit:cover; flex-shrink:0;
  background:var(--surface);
}
.avatar-fallback{
  width:96px; height:96px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--accent); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-size:38px; font-weight:600; color:var(--accent);
}
.hero-text{ flex:1; min-width:240px }

/* ปรับข้อความ Role ให้เป็นสีแดง ตัวพิมพ์ใหญ่ และฟอนต์สไตล์โค้ด */
.role{
  font:600 12px/1.4 var(--mono); letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin:0 0 16px;
}

/* ชื่อใหญ่และหนาขึ้น */
h1{ font-size:clamp(36px,6vw,54px); line-height:1.15; font-weight:800; margin:0 0 12px; letter-spacing:-.02em }
.tagline{ font-size:clamp(17px,2.6vw,20px); color:var(--text); margin:0; opacity:.92 }

/* About Me section ปรับให้อ่านง่ายขึ้นเหมือนในรูป */
.about{ color:var(--muted); margin:36px 0 0; max-width:70ch; font-size: 16px; line-height: 1.8; }

.links{ display:flex; flex-wrap:wrap; gap:10px; padding:0; margin:32px 0 0; list-style:none }
.links a{
  display:inline-block; border:1px solid var(--line); border-radius:999px;
  padding:9px 26px; color:var(--text); text-decoration:none; font-size:15px;
  transition:border-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.links a:hover, .links a:focus-visible{ 
  border-color:var(--accent); 
  color:var(--accent);
  box-shadow: 0 0 10px rgba(255, 51, 51, 0.2);
}

section{ margin-top:52px }

/* หัวข้อ (กำลังเรียนรู้ / ผลงาน) */
h2{
  font:700 15px/1 var(--mono); letter-spacing:.1em;
  color:var(--text); border-bottom:1px solid var(--line);
  padding-bottom:12px; margin:0 0 24px;
}

/* ขีดสีแดงด้านซ้ายเวลามี List เหมือนในรูป */
.learning{ list-style:none; padding:0; margin:0 }
.learning li{
  border-left:3px solid var(--accent); padding:4px 0 4px 16px;
  margin-bottom:18px; color:var(--text); font-weight: 500;
}

.works{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)) }
.work{
  border:1px solid var(--line); border-radius:12px; padding:18px 20px;
  background:var(--surface);
  transition: transform .2s ease, border-color .2s ease;
}
.work:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}
.work h3{ margin:0 0 8px; font-size:17px; color:var(--text); font-weight: 700; }
.work p{ margin:0; color:var(--muted); font-size:14.5px; line-height: 1.6; }
.work a{ color:var(--accent); text-decoration:none; font-size:14px; display:inline-block; margin-top:12px; font-weight: 600; }
.work a:hover{ text-decoration:underline }

/* Network panel & Footer */
.panel{ border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:4px 20px 16px }
.row{
  display:grid; grid-template-columns:minmax(130px,1fr) minmax(0,1.5fr); gap:12px;
  padding:11px 0; border-bottom:1px dashed var(--line); align-items:baseline;
}
.row:last-of-type{ border-bottom:0 }
.row dt{ color:var(--muted); font-size:14px; margin:0 }
.row dd{ margin:0; font-family:var(--mono); font-size:14px; color:var(--accent); word-break:break-all }
.row .note{ display:block; color:var(--muted); font-family:inherit; font-size:12.5px }
.hint{ color:var(--muted); font-size:14px; margin:14px 0 0 }

footer{ margin-top:64px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; text-align:center; }
footer a{ color:var(--accent); text-decoration:none; }
footer a:hover{ text-decoration:underline; }

@media (max-width:520px){
  .hero{ padding-top:44px; gap:16px }
  .avatar, .avatar-fallback{ width:80px; height:80px; font-size:28px }
  .row{ grid-template-columns:1fr; gap:2px }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img class="avatar" id="avatar" alt="" width="96" height="96">
    <div class="hero-text">
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>
  
  <p class="about" id="about"></p>
  
  <ul class="links" id="links"></ul>

  <!-- ปรับกลับมาใช้คำว่า กำลังเรียนรู้ ตามรูปต้นฉบับ -->
  <section>
    <h2>กำลังเรียนรู้</h2>
    <ul class="learning" id="learning"></ul>
  </section>

  <!-- ปรับกลับมาใช้คำว่า ผลงาน ให้เข้ากับหัวข้อด้านบน -->
  <section>
    <h2>ผลงาน</h2>
    <div class="works" id="works"></div>
  </section>

  <!-- Network Info (ซ่อนได้ถ้าไม่ต้องการให้แสดง แต่ผมคงไว้เผื่อคุณใช้โชว์สกิลฝั่ง Web Dev) -->
  <section>
    <h2>Connection Info 🌐</h2>
    <div class="panel">
      <dl id="netpanel"></dl>
      <p class="hint">Press F12, go to the Network tab, and press Ctrl+F5 to compare values.</p>
    </div>
  </section>

  <footer>
    Built with HTML, CSS, and JavaScript · Hosted on GitHub Pages<br>
    <a id="repolink" href="https://github.com">View source code</a>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

document.title = ME.name + " - Portfolio";
document.documentElement.dataset.theme = ME.theme || 'crimson';

$('role').textContent    = ME.role;
$('name').textContent    = ME.name;
$('tagline').textContent = ME.tagline;
$('about').textContent   = ME.about;

const avatar = $('avatar');
avatar.alt = 'Profile picture of ' + ME.name;
avatar.addEventListener('error', () => {
  const box = document.createElement('div');
  box.className = 'avatar-fallback';
  box.setAttribute('aria-hidden', 'true');
  box.textContent = (ME.name || '?').trim().charAt(0);
  avatar.replaceWith(box);
});
avatar.src = 'https://github.com/' + ME.github + '.png?size=192';

for (const item of ME.learning || []) {
  const li = document.createElement('li');
  li.textContent = item;
  $('learning').appendChild(li);
}

for (const link of ME.links || []) {
  const a = document.createElement('a');
  a.href = link.url;
  a.textContent = link.label;
  a.rel = 'noopener noreferrer';
  const li = document.createElement('li');
  li.appendChild(a);
  $('links').appendChild(li);
}

if (!ME.works || ME.works.length === 0) {
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = 'No projects displayed yet. Currently learning and will add more soon!';
  $('works').appendChild(box);
} else {
  for (const w of ME.works) {
    const card = document.createElement('div');
    card.className = 'work';
    const h3 = document.createElement('h3');
    h3.textContent = w.title;
    const p = document.createElement('p');
    p.textContent = w.desc;
    card.append(h3, p);
    if (w.url) {
      const a = document.createElement('a');
      a.href = w.url;
      a.textContent = 'View Project ↗';
      a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    $('works').appendChild(card);
  }
}

$('repolink').href = 'https://github.com/' + ME.github + '/' + ME.github + '.github.io';

function ms(v) {
  if (typeof v !== 'number' || v < 0 || Number.isNaN(v)) return '—';
  return Math.round(v) + ' ms';
}

window.addEventListener('load', () => setTimeout(() => {
  const nav = performance.getEntriesByType('navigation')[0];
  const rows = [
    ['Domain name', location.hostname || '(Local file)',
     'Domain name must be resolved to an IP address via DNS before contacting the server.'],
    ['Protocol', location.protocol,
     'https is HTTP with encryption and server authentication via certificate.'],
  ];
  if (nav) rows.push(
    ['HTTP version', nav.nextHopProtocol || '—',
     'h2 is HTTP/2 and h3 is HTTP/3, allowing multiple files to be sent over a single connection.'],
    ['DNS lookup', ms(nav.domainLookupEnd - nav.domainLookupStart),
     'Time to resolve the domain to an IP address. 0 ms means it is already cached.'],
    ['Connection + TLS', ms(nav.connectEnd - nav.connectStart),
     'Time to establish connection, including TLS handshake before data transfer.'],
    ['TTFB', ms(nav.responseStart - nav.requestStart),
     'Time To First Byte: time from sending request to receiving the first byte. Higher if server is far.'],
  );

  for (const [label, value, note] of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    dd.textContent = value;
    const small = document.createElement('span');
    small.className = 'note';
    small.textContent = note;
    dd.appendChild(small);
    row.append(dt, dd);
    $('netpanel').appendChild(row);
  }
}, 0));
</script>
</body>
</html>
